name: Deploy to Cloudflare

# Fork 之后在仓库 Settings → Secrets and variables → Actions 配置好 Secrets，
# 手动点 Run workflow 即可完成部署；push 到 main 也会自动触发。
# 未配置 Secrets 时会自动跳过（绿灯），不会报错发邮件。
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: 检查部署 Secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: 校验必需 Secrets 是否已配置
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          ZONE_NAME: ${{ secrets.ZONE_NAME }}
          MAIL_DOMAINS: ${{ secrets.MAIL_DOMAINS }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          missing=""
          for v in CF_API_TOKEN CF_ACCOUNT_ID SITE_DOMAIN ZONE_NAME MAIL_DOMAINS D1_DATABASE_ID; do
            if [ -z "$(printenv $v)" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "缺少必需 Secrets:$missing"
            echo "::notice::尚未配置部署 Secrets，已跳过部署。到 Settings → Secrets and variables → Actions 按 README「方式一」配置后，再手动 Run workflow 即可。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "必需 Secrets 齐全，开始部署。"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 日志公开可见：把所有敏感值注册为掩码，后续任何步骤（含 wrangler 输出）都不落明文
      - name: 注册日志掩码
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          ZONE_NAME: ${{ secrets.ZONE_NAME }}
          MAIL_DOMAINS: ${{ secrets.MAIL_DOMAINS }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          echo "::add-mask::$SITE_DOMAIN"
          echo "::add-mask::https://$SITE_DOMAIN"
          echo "::add-mask::$ZONE_NAME"
          echo "::add-mask::$MAIL_DOMAINS"
          echo "::add-mask::$D1_DATABASE_ID"
          IFS=',' ; for d in $MAIL_DOMAINS; do echo "::add-mask::$d"; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成部署配置
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          ZONE_NAME: ${{ secrets.ZONE_NAME }}
          MAIL_DOMAINS: ${{ secrets.MAIL_DOMAINS }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          DEFAULT_TTL_HOURS: ${{ secrets.DEFAULT_TTL_HOURS }}
          MAX_TTL_HOURS: ${{ secrets.MAX_TTL_HOURS }}
          BRAND: ${{ secrets.BRAND }}
        run: node scripts/configure-deploy.mjs

      - name: 初始化数据库（schema 全部 IF NOT EXISTS，可重复执行）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute "${{ secrets.D1_DATABASE_NAME || 'fademail' }}" \
            --remote --file=schema.sql -y \
            --config wrangler.deploy.jsonc

      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      # 站点门禁密码：未设置时全站 503 锁死，务必配置
      - name: 写入站点门禁密码（SITE_PASSWORD）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "未配置 SITE_PASSWORD secret，跳过（注意：全站将处于门禁锁定状态）"
            exit 0
          fi
          echo "$SITE_PASSWORD" | npx wrangler secret put SITE_PASSWORD --config wrangler.deploy.jsonc
