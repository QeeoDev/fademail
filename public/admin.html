<div class="ad-shell">
  <header class="ad-top">
    <div class="brand">
      <span class="brand-logo"><svg><use href="#i-logo"/></svg></span>
      <span>FadeMail</span>
      <span class="tag">管理后台</span>
    </div>
    <div class="grow"></div>
    <button class="icon-btn" id="btn-refresh" title="刷新数据"><svg><use href="#i-refresh"/></svg></button>
    <button class="icon-btn" id="btn-theme" title="切换主题">
      <svg class="ic-sun"><use href="#i-sun"/></svg>
      <svg class="ic-moon"><use href="#i-moon"/></svg>
    </button>
    <button class="btn outline sm" id="btn-logout" hidden><svg><use href="#i-logout"/></svg>退出</button>
  </header>

  <main class="ad-main">
    <section class="ad-login" id="login-view">
      <noscript>
        <div class="card"><h1>需要启用 JavaScript</h1><p>管理后台依赖浏览器脚本，请在浏览器设置里允许 JavaScript 后刷新。</p></div>
      </noscript>
      <div class="card" id="login-card" hidden>
        <h1>管理登录</h1>
        <form id="login-form">
          <div class="field">
            <label class="field-label" for="login-user">账号</label>
            <input id="login-user" type="text" autocomplete="username" placeholder="请输入管理员账号" autofocus required>
          </div>
          <div class="field">
            <label class="field-label" for="login-pass">密码</label>
            <div class="pw">
              <input id="login-pass" type="password" autocomplete="current-password" placeholder="请输入登录密码" required>
              <button type="button" class="pw-eye" tabindex="-1" aria-label="显示密码"><svg><use href="#i-eye"/></svg></button>
            </div>
          </div>
          <button class="btn primary block" type="submit" id="login-btn">登录</button>
        </form>
        <div class="hint" id="login-error" hidden></div>
      </div>
      <div class="card" id="boot-card">
        <h1>正在载入管理后台…</h1>
        <p>如果长时间没有反应，请刷新页面；仍打不开时请确认访问的是正确的站点地址。</p>
      </div>
    </section>

    <section id="dash-view" hidden>
      <nav class="ad-tabs" id="tabs">
        <button class="ad-tab on" data-tab="overview">总览</button>
        <button class="ad-tab" data-tab="mailboxes">邮箱</button>
        <button class="ad-tab" data-tab="domains">域名</button>
        <button class="ad-tab" data-tab="keys">API Key</button>
        <button class="ad-tab" data-tab="events">活动</button>
        <button class="ad-tab" data-tab="settings">设置</button>
      </nav>
      <div id="panel"></div>
    </section>
  </main>
</div>

<div id="modal-root"></div>
<div class="toasts" id="toasts"></div>

<script src="/admin.js" type="module"></script>
</body>
</html>
