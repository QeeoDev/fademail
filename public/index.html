<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FadeMail · 临时邮箱</title>
<meta name="description" content="隐私友好的临时邮箱：无需注册、自定义有效期、支持多域名、邮件沙箱渲染、到期自动销毁。">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://fademail.example.com/">
<meta property="og:title" content="FadeMail · 临时邮箱">
<meta property="og:description" content="无需注册的临时邮箱，到期自动销毁邮箱与全部邮件。">
<meta property="og:url" content="https://fademail.example.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234d6bfe'/%3E%3Cpath d='M7 11.5h18v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='m7.5 12 8.5 6 8.5-6' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

</head>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <a class="brand" href="/" title="FadeMail">
        <span class="brand-logo"><svg><use href="#i-logo"/></svg></span>
        <span class="brand-name" id="brand-name">FadeMail</span>
      </a>
      <button class="icon-btn" id="btn-collapse" title="收起侧边栏"><svg><use href="#i-back"/></svg></button>
    </div>

    <button class="new-btn" id="btn-new">
      <svg><use href="#i-plus"/></svg><span>新建临时邮箱</span>
    </button>

    <div class="sb-scroll">
      <div class="sb-label"><span>我的邮箱</span><span class="sb-count" id="saved-count" hidden>0</span></div>
      <ul class="mb-list" id="saved-list"></ul>
      <p class="sb-empty" id="saved-empty">暂无邮箱<br><span>创建后会保存在本机浏览器</span></p>
    </div>

    <div class="sb-bottom">
      <button class="sb-item" data-act="recover"><svg><use href="#i-key"/></svg><span>找回邮箱</span></button>
      <button class="sb-item" data-act="api"><svg><use href="#i-code"/></svg><span>开放 API</span></button>
      <button class="sb-item" data-act="settings"><svg><use href="#i-gear"/></svg><span>设置</span></button>
      <div class="sb-user">
        <span class="status"><i id="status-dot"></i><span id="sb-status">已连接</span></span>
        <button class="icon-btn" id="btn-theme" title="切换主题">
          <svg class="ic-sun"><use href="#i-sun"/></svg>
          <svg class="ic-moon"><use href="#i-moon"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="sb-mask" id="sb-mask" hidden></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn lg mobile-only" id="btn-menu" aria-label="打开侧边栏"><svg><use href="#i-menu"/></svg></button>
      <button class="icon-btn lg desktop-only" id="btn-expand" aria-label="展开侧边栏"><svg><use href="#i-menu"/></svg></button>

      <div class="addr-box" id="addr-box" hidden>
        <button class="addr" id="addr-btn" title="点击复制地址">
          <span id="addr-text">—</span>
          <svg class="ic-copy"><use href="#i-copy"/></svg>
          <svg class="ic-done"><use href="#i-check"/></svg>
        </button>
        <span class="state-pill" id="state-pill"><i></i>生效中</span>
        <span class="left-time" id="left-time"></span>
      </div>

      <div class="top-actions">
        <button class="icon-btn lg" id="btn-refresh" title="刷新（快捷键 R）"><svg><use href="#i-refresh"/></svg></button>
        <button class="icon-btn lg" id="btn-bell" title="桌面通知"><svg><use href="#i-bell-off"/></svg></button>
        <button class="icon-btn lg" id="btn-more" title="邮箱操作" hidden><svg><use href="#i-more"/></svg></button>
      </div>
    </header>

    <div class="menu" id="more-menu" hidden>
      <button data-act="extend"><svg><use href="#i-clock"/></svg>延长有效期</button>
      <button data-act="note"><svg><use href="#i-edit"/></svg>修改备注</button>
      <button data-act="password"><svg><use href="#i-lock"/></svg>找回密码</button>
      <button data-act="read-all"><svg><use href="#i-mail-open"/></svg>全部标为已读</button>
      <button data-act="clear"><svg><use href="#i-inbox"/></svg>清空收件箱</button>
      <hr>
      <button data-act="forget"><svg><use href="#i-close"/></svg>从列表移除</button>
      <button class="danger" data-act="burn"><svg><use href="#i-trash"/></svg>销毁邮箱</button>
    </div>

    <div class="content" id="content">
      <div class="boot-error" id="boot-error" hidden>页面加载异常，请刷新重试</div>
      <noscript>
        <p class="boot-error">需要启用 JavaScript 才能使用 FadeMail。</p>
      </noscript>
      <section class="hero" id="hero">
        <div class="hero-inner">
          <div class="hero-logo"><svg><use href="#i-logo"/></svg></div>
          <h1>你的临时邮箱<br>用完即焚</h1>
          <p class="hero-sub">无需注册，到期自动清除邮箱与全部邮件</p>
          <p class="hero-notice" id="hero-notice" hidden></p>
          <div class="create-slot" id="create-slot"></div>
          <div class="hero-trust">
            <ul class="hero-points">
              <li>
                <span class="hp-ico"><svg><use href="#i-spark"/></svg></span>
                <span class="hp-txt"><b>无需注册</b><em>打开即用，即刻生成</em></span>
              </li>
              <li>
                <span class="hp-ico"><svg><use href="#i-shield"/></svg></span>
                <span class="hp-txt"><b>隐私优先</b><em>脚本隔离、图片拦截</em></span>
              </li>
              <li>
                <span class="hp-ico"><svg><use href="#i-clock"/></svg></span>
                <span class="hp-txt"><b>到期即焚</b><em>过期自动清理</em></span>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <section class="inbox" id="inbox" hidden>
        <div class="inbox-inner">
          <div class="list-head">
            <h2>收件箱<span class="soft" id="list-count"></span></h2>
            <div class="list-tools">
              <label class="search" id="search-box">
                <svg><use href="#i-search"/></svg>
                <input id="search-input" placeholder="搜索发件人、主题或正文" autocomplete="off" spellcheck="false">
                <button type="button" class="search-clear" id="search-clear" hidden aria-label="清除"><svg><use href="#i-close"/></svg></button>
              </label>
            </div>
          </div>

          <div class="tabs" id="tabs">
            <button class="tab on" data-filter="all">全部</button>
            <button class="tab" data-filter="unread">未读<span class="tab-num" id="tab-unread" hidden>0</span></button>
            <span class="tabs-spacer"></span>
            <button class="ghost-btn" id="btn-read-all" data-act="read-all"><svg><use href="#i-check"/></svg>全部已读</button>
          </div>

          <div class="mail-list" id="mail-list"></div>
        </div>
      </section>

      <section class="reader" id="reader" hidden></section>
    </div>
  </main>
</div>

<div class="modal-root" id="modal-root" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h3 id="modal-title">标题</h3>
      <button class="icon-btn" data-close aria-label="关闭"><svg><use href="#i-close"/></svg></button>
    </header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
